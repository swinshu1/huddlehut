<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huddle Hut</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%20stroke%3D%22%236e6e73%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M8%2038%20A26%2026%200%200%201%2056%2038%22/%3E%3Ccircle%20cx%3D%2221%22%20cy%3D%2246%22%20r%3D%228%22%20fill%3D%22%23AFA9EC%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2243%22%20r%3D%228%22%20fill%3D%22%235DCAA5%22%20stroke%3D%22none%22/%3E%3Ccircle%20cx%3D%2243%22%20cy%3D%2246%22%20r%3D%228%22%20fill%3D%22%23ED93B1%22%20stroke%3D%22none%22/%3E%3C/svg%3E">
<style>
:root {
  --bg: #ffffff;
  --fg: #1d1d1f;
  --muted: #86868b;
  --line: #ececee;
  --hover: #f5f5f7;
  --attn: #c2410c;
  --chip-fg: 34%;
  --chip-bg: 94%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --fg: #f2f2f7;
    --muted: #8e8e93;
    --line: #2c2c2e;
    --hover: #26262a;
    --attn: #fb923c;
    --chip-fg: 82%;
    --chip-bg: 22%;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 14.5px/1.6 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, sans-serif; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 4px; }
h1, h2 { margin: 0; font-weight: 600; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.side { border-right: 1px solid var(--line); padding: 28px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 0 10px; margin-bottom: 28px; }
.brand svg { width: 30px; height: 21px; color: var(--fg); flex: none; }
.label { font-size: 12.5px; color: var(--muted); padding: 0 10px; margin: 20px 0 4px; }
.side ul { list-style: none; margin: 0; padding: 0; }
.side li a, .side .mem { display: block; padding: 6px 10px; border-radius: 10px; }
.side li a:hover, .side .mem:hover { background: var(--hover); }
.side [aria-current="page"] { background: var(--hover); }
.side .m { display: block; font-size: 12.5px; color: var(--muted); }
.side .mem { margin-top: 20px; }
.me { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 6px 10px; border-radius: 10px; text-align: left; }
.me:hover { background: var(--hover); }
.me .sub { font-size: 12.5px; color: var(--muted); }
.me-edit { padding: 2px 10px; }
.me-edit input { width: 100%; font: inherit; color: var(--fg); background: var(--bg); border: 0; border-radius: 8px;
  box-shadow: 0 0 0 1px var(--line); padding: 5px 9px; }
.me-edit input:focus { outline: none; box-shadow: 0 0 0 1px var(--fg); }
.me-hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

main { padding: 44px clamp(20px, 5vw, 64px) 96px; max-width: 820px; }
.title { font-size: 22px; letter-spacing: -.01em; }
.meta { color: var(--muted); margin-top: 2px; }
.goal { margin: 14px 0 0; max-width: 65ch; }

.goalbox { margin-top: 20px; }
.goal-head { display: flex; align-items: baseline; gap: 10px; font-size: 12.5px; color: var(--muted); }
.goal-text { margin: 2px 0 0; max-width: 65ch; font-size: 15.5px; overflow-wrap: anywhere; }
.edit { font-size: 12.5px; color: var(--muted); }
.edit:hover { color: var(--fg); }
.progress { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.bar { position: relative; flex: 0 1 220px; height: 6px; border-radius: 999px; overflow: hidden;
  background: linear-gradient(90deg, #AFA9EC, #5DCAA5, #ED93B1); }
.bar i { position: absolute; top: 0; right: 0; bottom: 0; background: var(--line); transition: width .4s; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
.milestones { list-style: none; margin: 8px 0 0; padding: 0; }
.milestones li { display: flex; align-items: flex-start; gap: 10px; padding: 3px 0; }
.check { flex: none; width: 16px; height: 16px; margin-top: 4px; border-radius: 50%; display: inline-grid; place-items: center;
  box-shadow: inset 0 0 0 1.5px var(--muted); }
button.check:not(:disabled):hover { box-shadow: inset 0 0 0 1.5px var(--fg); }
.check:disabled { cursor: default; }
.check.on { background: #5DCAA5; box-shadow: none; }
.check.on::after { content: ""; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.check.ghost { box-shadow: inset 0 0 0 1.5px var(--line); }
.ms-text { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; }
.done .ms-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.ms-by { font-size: 12px; margin-left: 4px; text-decoration: none; display: inline-block; }
.milestones .end { margin-top: 3px; }
.milestones li:hover .end { opacity: 1; }
.add-ms { flex: 1; max-width: 420px; font: inherit; color: var(--fg); background: transparent; border: 0; padding: 0; }
.add-ms::placeholder { color: var(--muted); }
.add-ms:focus { outline: none; }
.add-ms:focus::placeholder { color: transparent; }

section { margin-top: 40px; }
section h2 { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.rows > li:first-child { border-top: 0; }

.who {
  display: inline-block; font-weight: 600; font-size: 13px; line-height: 1.5; padding: 0 8px; border-radius: 999px;
  color: hsl(var(--hue) 45% var(--chip-fg)); background: hsl(var(--hue) 70% var(--chip-bg));
}
.away { display: block; font-size: 12px; color: var(--muted); font-weight: 400; padding-left: 8px; margin-top: 2px; }
.dim { color: var(--muted); }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.more { color: var(--muted); font-size: 13px; margin-top: 2px; }
.more:hover { color: var(--fg); }
.path { font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
.lock { font-size: 12px; color: var(--muted); margin-left: 6px; }
.attn::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--attn); margin-right: 8px; vertical-align: 2px; }

.huddlers { margin-top: 22px; padding: 12px 14px 14px; border-radius: 16px; background: var(--hover); }
.huddlers-label { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; margin: 0 0 10px; }
.huddlers-label svg { width: 22px; height: 15px; color: var(--fg); flex: none; }
.huddlers-label .count { font-weight: 400; color: var(--muted); }
.roster { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.confirm { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--hover); }
.confirm p { margin: 0; max-width: 60ch; }
.confirm input { width: 100%; max-width: 460px; font: inherit; color: var(--fg); background: var(--bg); border: 0;
  box-shadow: 0 0 0 1px var(--line); border-radius: 8px; padding: 7px 10px; margin-top: 10px; }
.confirm input:focus { outline: none; box-shadow: 0 0 0 1px var(--fg); }
.confirm-actions { display: flex; gap: 8px; margin-top: 12px; }
.btn { font-size: 13.5px; padding: 5px 14px; border-radius: 999px; box-shadow: 0 0 0 1px var(--line); background: var(--bg); }
.btn:hover { box-shadow: 0 0 0 1px var(--muted); }
.btn.primary { background: var(--fg); color: var(--bg); box-shadow: none; }
.btn:disabled { opacity: .6; cursor: default; }
.err { color: var(--attn); font-size: 13px; margin-top: 8px !important; }
.closeb { float: right; margin-top: 6px; font-size: 13px; color: var(--muted); padding: 3px 10px; border-radius: 999px; box-shadow: 0 0 0 1px var(--line); }
.closeb:hover { color: var(--fg); box-shadow: 0 0 0 1px var(--muted); }
.end { opacity: 0; color: var(--muted); font-size: 14px; line-height: 1; padding: 0 2px; border-radius: 4px; }
.agent:hover .end, .end:focus-visible { opacity: 1; }
.end:hover { color: var(--fg); background: var(--bg); }
@media (hover: none) { .end { opacity: .6; } }
.roster .agent { display: inline-flex; align-items: baseline; gap: 6px; cursor: default; }
.ping { border-radius: 999px; }
.ping:hover .who { box-shadow: 0 0 0 1.5px hsl(var(--hue) 45% var(--chip-fg)); }
.ping-all { margin-left: auto; font-size: 12.5px; font-weight: 400; color: var(--muted); padding: 1px 10px; border-radius: 999px;
  box-shadow: 0 0 0 1px var(--line); }
.ping-all:hover { color: var(--fg); box-shadow: 0 0 0 1px var(--muted); }
.composer { display: flex; gap: 8px; margin-top: 28px; }
.composer input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--bg); border: 0; border-radius: 999px;
  box-shadow: 0 0 0 1px var(--line); padding: 7px 14px; }
.composer input:focus { outline: none; box-shadow: 0 0 0 1px var(--fg); }
.composer input::placeholder { color: var(--muted); }
.composer + .err { margin-left: 14px !important; }
.roster .sub { font-size: 12px; color: var(--muted); }
.roster .reach { font-size: 12px; color: var(--attn); margin-left: 4px; cursor: help; }
.roster .reach.old { color: var(--muted); }
.waiting { list-style: none; margin: 32px 0 0; padding: 0; }
.waiting li { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) auto; gap: 14px; padding: 12px 14px;
  margin-bottom: 8px; border-radius: 12px; background: color-mix(in srgb, var(--attn) 10%, transparent); }
.waiting .label { font-size: 12.5px; color: var(--attn); padding: 0; margin: 0 0 2px; }  /* not the sidebar .label */
.waiting .who { align-self: start; justify-self: start; }
.waiting time { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.waiting .answer { display: flex; gap: 8px; margin-top: 8px; }
.waiting .answer input { flex: 1; min-width: 0; }
.stream { margin-top: 32px; }
.dot::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--attn); margin-right: 6px; vertical-align: 2px; }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) auto; gap: 14px; padding: 7px 0; }
.log .who { align-self: start; justify-self: start; }
.log .same .who { visibility: hidden; }
.log time { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.log .re { color: var(--muted); font-size: 13px; }
.text { overflow-wrap: anywhere; white-space: pre-line; }
.path, .text code, .sha { font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; background: var(--hover); border-radius: 4px; padding: 0 4px; }
.sha { background: none; padding: 0; }
.ref { color: var(--muted); text-decoration: underline dotted; text-underline-offset: 3px; }
.ref:hover { color: var(--fg); }
.mention { font-weight: 600; color: hsl(var(--hue) 45% var(--chip-fg)); }
.log li { scroll-margin: 80px; border-radius: 6px; transition: background-color .6s; }
.log li.flash { background: var(--hover); }
@media (prefers-reduced-motion: reduce) { .log li { transition: none; } }

.link { color: var(--muted); margin-top: 28px; }
.link:hover { color: var(--fg); }

.search { width: 100%; max-width: 420px; font: inherit; color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 8px 0; margin-top: 24px; }
.search:focus { outline: none; border-bottom-color: var(--fg); }
.lessons { list-style: none; margin: 8px 0 0; padding: 0; }
.lessons li { padding: 18px 0; border-top: 1px solid var(--line); }
.lessons li:first-child { border-top: 0; }
.lessons h3 { margin: 0; font-size: 15px; font-weight: 600; }
.lessons p { margin: 4px 0 0; max-width: 65ch; }

.boards { list-style: none; margin: 24px 0 0; padding: 0; }
.boards a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.boards li:first-child a { border-top: 0; }
.boards a:hover .name { text-decoration: underline; text-underline-offset: 3px; }
.empty { color: var(--muted); margin-top: 24px; max-width: 55ch; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px 12px; }
  .rows > li, .log li { grid-template-columns: 1fr; gap: 0; }
  .log .same .who { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#/"><svg viewBox="6 16 52 36" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true"><path d="M10 36 A24 24 0 0 1 54 36"/><circle cx="23" cy="43" r="6" fill="#AFA9EC" stroke="none"/><circle cx="32" cy="41" r="6" fill="#5DCAA5" stroke="none"/><circle cx="41" cy="43" r="6" fill="#ED93B1" stroke="none"/></svg>huddle hut</a>
    <div class="label">open</div>
    <ul id="open-boards"></ul>
    <div class="label" id="closed-label">closed</div>
    <ul id="closed-boards"></ul>
    <a class="mem" href="#/memory" id="mem-link">memory</a>
    <div class="label">you</div>
    <div id="me"></div>
  </aside>
  <main id="main"></main>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const hue = n => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
function short(name) { const i = name.lastIndexOf("-"); return i > 0 && /^[0-9a-f]{4}$/.test(name.slice(i + 1)) ? name.slice(i + 1) : name; }
const who = (id, name) => `<span class="who" style="--hue:${hue(id)}" title="${esc(id)}">${esc(name || short(id))}</span>`;
function ago(t) {
  const s = Date.now() / 1000 - t;
  return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : `${Math.floor(s / 86400)}d ago`;
}
const clock = t => {
  const d = new Date(t * 1000), time = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  return d.toDateString() === new Date().toDateString() ? time : `${d.toLocaleDateString([], {month: "short", day: "numeric"})}, ${time}`;
};
const day = t => new Date(t * 1000).toLocaleDateString([], {month: "short", day: "numeric"});
const PATH = /(?<![\w\/.:@-])((?:[\w.-]+\/)+(?:[\w.*-]*[\w*])?|[\w-]+\.(?:py|pyi|ts|tsx|js|jsx|mjs|md|json|toml|ya?ml|sql|sh|go|rs|css|html|txt))(?![\w\/])/g;
const COMMIT = /^committed ([0-9a-f]{7,40}) \(([^)]+)\): /;
let AG = {};  // lowercase nickname or tag -> agent id, for @mentions on the current board
// "#12" usually means message 12, but not after words like "gap", "PR" or "issue"
const NOT_MSG = /(?:gap|item|issue|pr|step|case|ticket|check|number|no\.?|finding|row|line|part|phase)\s*$/i;
function fmt(raw) {
  let head = "", body = raw;
  const c = raw.match(COMMIT);
  if (c) { head = `committed <span class="sha">${c[1]}</span> <span class="dim">${esc(c[2])}</span> `; body = raw.slice(c[0].length); }
  return head + esc(body).split(/(`[^`]+`)/).map(seg => /^`[^`]+`$/.test(seg) ? `<code>${seg.slice(1, -1)}</code>` : seg
    .replace(PATH, (p0, p) => /[A-Za-z]/.test(p) ? `<span class="path">${p}</span>` : p0)
    .replace(/(^|[^\w&;])#(\d+)\b/g, (m0, pre, n, at, str) => NOT_MSG.test(str.slice(0, at + pre.length))
      ? m0 : `${pre}<a class="ref" href="#" data-ref="${n}">#${n}</a>`)
    .replace(/(^|[^\w])@([\w-]+)/g, (m0, pre, n) => AG[n.toLowerCase()]
      ? `${pre}<span class="mention" style="--hue:${hue(AG[n.toLowerCase()])}">@${esc(n)}</span>` : m0)
  ).join("");
}
const VERB = {decision: "decided", question: "asks", answer: "answered", blocker: "blocked", promise: "promised",
              result: "reported", deadend: "dead end", status: "status"};

async function get(url) {
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

let boards = [], last = "";
let pending = null, outcomeDraft = "", actionError = "", working = false;  // inline confirm panel state
let errAt = "panel", goalDraft = null, msDraft = "", cur = null;  // goal editing; cur = the board on screen
let me = "user", meDraft = null, meError = "";  // your name, shown instead of "user"
let sayDraft = "";  // the message box under the huddlers
const replyDrafts = {};  // post id -> your unsent answer to that ask
const open = new Set();

function long(text, key) {
  if (text.length < 240 || open.has(key)) return `<div class="text">${fmt(text)}</div>`;
  return `<div class="text clamp">${fmt(text)}</div><button class="more" data-open="${esc(key)}">more</button>`;
}

function renderMe() {  // drawn on its own, so the 4-second refresh never wipes a name being typed
  $("#me").innerHTML = meDraft === null
    ? `<button class="me" id="edit-me" title="change your name">${who("user", me)}<span class="sub">${me === "user" ? "set your name" : "rename"}</span></button>`
    : `<div class="me-edit"><input id="me-input" value="${esc(meDraft)}" maxlength="16" placeholder="your name" autocomplete="off" aria-label="your name">
       <div class="me-hint">enter to save, esc to cancel. agents see it too.</div>${meError ? `<p class="err">${esc(meError)}</p>` : ""}</div>`;
}
async function editMe() {
  meDraft = me === "user" ? "" : me; meError = ""; renderMe();
  const f = $("#me-input"); f.focus(); f.select();
}
async function saveMe() {
  try {
    const r = await fetch("/api/me", {method: "POST", headers: {"X-Huddlehut": "1", "Content-Type": "application/json"},
                                      body: JSON.stringify({name: meDraft})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.statusText);
    me = d.name; meDraft = null; meError = "";
    renderMe(); render(true);  // every board shows the new name
  } catch (e) {
    meError = e.message; renderMe();
    const f = $("#me-input"); f.focus();
  }
}

function side(route) {
  const item = b => `<li><a href="#/b/${esc(b.id)}"${route.board === b.id ? ' aria-current="page"' : ""}>${esc(b.name)}
    <span class="m">${b.status === "open" ? (b.active_agents ? `${b.active_agents} active` : "quiet") + `, ${ago(b.last_at)}` : esc(b.project)}</span></a></li>`;
  const o = boards.filter(b => b.status === "open"), c = boards.filter(b => b.status !== "open");
  $("#open-boards").innerHTML = o.map(item).join("") || '<li class="dim" style="padding:6px 10px">all quiet</li>';
  $("#closed-boards").innerHTML = c.map(item).join("");
  $("#closed-label").hidden = !c.length;
  route.view === "memory" ? $("#mem-link").setAttribute("aria-current", "page") : $("#mem-link").removeAttribute("aria-current");
}

function logList(ms) {  // newest first; a run of posts by one agent shows its pill once, on the newest
  const list = [...ms].reverse();
  return `<ol class="log">${list.map((m, i) => {
    const p = list[i - 1], same = p && p.author === m.author && p.at - m.at < 300;
    const verb = VERB[m.kind] && m.kind !== "status" ? `<span class="dim">${VERB[m.kind]}</span> ` : "";
    const re = m.reply_to ? `<div class="re">re <a class="ref" href="#" data-ref="${m.reply_to}">#${m.reply_to}</a>${m.reply_snippet ? `: ${esc(m.reply_snippet)}` : ""}</div>` : "";
    const dot = m.open ? `<span class="dot" title="not answered yet"></span>` : "";
    return `<li id="m${m.id}" class="${same ? "same" : ""}">${who(m.author, m.name)}<div>${re}<span class="text">${dot}${verb}${fmt(m.content)}</span></div><time>${clock(m.at)}</time></li>`;
  }).join("")}</ol>`;
}

function goalBox(d) {  // the board's goal and its checklist; the user edits both, agents check items off
  const b = d.board, ms = d.milestones || [], live = b.status === "open";
  const err = actionError && errAt === "goal" ? `<p class="err">${esc(actionError)}</p>` : "";
  const busy = working ? " disabled" : "";
  const editing = goalDraft !== null && live;
  const head = editing ? `<div class="confirm" role="group" aria-label="board goal">
      <p>what should everyone on this board work toward? agents are told when it changes.</p>
      <input id="goal-input" value="${esc(goalDraft)}" placeholder="the goal" maxlength="1000" autocomplete="off">
      <div class="confirm-actions"><button class="btn primary" id="save-goal"${busy}>save goal</button><button class="btn" id="cancel-goal">cancel</button></div>${err}</div>`
    : b.goal ? `<div class="goal-head">goal${live ? '<button class="edit" id="edit-goal">edit</button>' : ""}</div><p class="goal-text">${fmt(b.goal)}</p>`
    : live ? `<button class="edit" id="edit-goal">+ set a goal</button>` : "";
  const done = ms.filter(m => m.done).length;
  const progress = ms.length ? `<div class="progress"><span class="bar" role="progressbar" aria-label="milestones done" aria-valuemin="0" aria-valuemax="${ms.length}" aria-valuenow="${done}"><i style="width:${100 - 100 * done / ms.length}%"></i></span>${done === ms.length ? "all done" : `${done} of ${ms.length}`}</div>` : "";
  const items = ms.map(m => {
    const by = m.done && m.done_by ? `<span class="ms-by mention" style="--hue:${hue(m.done_by)}">${esc(m.done_by_name)}</span>` : "";
    const x = live ? `<button class="end" data-del="${m.id}" title="remove" aria-label="remove milestone: ${esc(m.text)}">×</button>` : "";
    return `<li class="${m.done ? "done" : ""}"><button class="check${m.done ? " on" : ""}" data-ms="${m.id}" data-done="${m.done ? 0 : 1}"${live ? "" : " disabled"}
      aria-pressed="${m.done}" aria-label="${m.done ? "done" : "not done"}: ${esc(m.text)}"></button><span class="ms-text">${fmt(m.text)}${by}</span>${x}</li>`;
  }).join("");
  const adder = live && (b.goal || ms.length) ? `<li><span class="check ghost" aria-hidden="true"></span><input id="ms-input" class="add-ms" placeholder="add a milestone" value="${esc(msDraft)}" maxlength="300" autocomplete="off" aria-label="add a milestone"></li>` : "";
  const list = items || adder ? `<ul class="milestones">${items}${adder}</ul>` : "";
  return head || list ? `<div class="goalbox">${head}${progress}${list}${editing ? "" : err}</div>` : "";
}

function board(d) {
  const b = d.board;
  cur = d;
  AG = {};
  for (const m of d.stream) { AG[m.name.toLowerCase()] = m.author; AG[short(m.author)] = m.author; }
  for (const [id, a] of Object.entries(d.agents)) { AG[(a.name || short(id)).toLowerCase()] = id; AG[short(id)] = id; }
  const order = a => a.state === "left" ? 2 : a.tag ? 1 : 0;   // active, then idle, then left
  const agents = Object.entries(d.agents).sort(([, x], [, y]) => order(x) - order(y) || y.seen_at - x.seen_at);
  const here = agents.filter(([, a]) => order(a) === 0).length;
  const roster = agents.map(([id, a]) => {
    const files = a.files.map(f => f.path + (f.locked ? " (locked)" : "")).join("\n");
    const sub = [a.model, a.tag].filter(Boolean).join(", ");
    const r = a.reach || {};
    const warn = r.status === "not responding"
        ? `<span class="reach" title="${esc(`${r.waiting} message(s) have waited for it since ${clock(r.since)} and it hasn't acted since: its session may be stuck, errored or closed. End its session if it's gone.`)}">not responding · ${r.waiting} waiting</span>`
      : r.status === "unlinked"
        ? `<span class="reach" title="its hooks never linked, so pings can't wake it; it sees messages only when it next uses a board tool. Ask it to join_board again.">can't be woken</span>` : "";
    const old = r.current === false
        ? `<span class="reach old" title="its board server started before the current Huddle Hut features (like the goal tool for checking off milestones), and a server keeps the code it started with. Restart that session to update it; for Codex, quit and reopen the app.">old board code</span>` : "";
    const name = a.name || short(id);
    const live = a.state !== "left" && b.status === "open";
    const pill = live ? `<button class="ping" style="--hue:${hue(id)}" data-ping="${esc(name)}" title="ping ${esc(name)} to look at the board" aria-label="ping ${esc(name)}">${who(id, a.name)}</button>` : who(id, a.name);
    const end = live ? `<button class="end" data-end="${esc(id)}" data-name="${esc(name)}" title="end session" aria-label="end ${esc(name)}'s session">×</button>` : "";
    return `<span class="agent" title="${esc(id + (files ? "\nfiles:\n" + files : ""))}">${pill}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}${warn}${old}${end}</span>`;
  }).join("");
  const logo = document.querySelector(".brand svg").outerHTML;
  const waiting = d.waiting.length ? `<ul class="waiting">${d.waiting.map(w => `<li>${who(w.author, w.name)}
      <div><div class="label">${w.source === "session" ? "waiting on you" : "asks you"}</div>${long(w.content, "w" + w.author + (w.id || ""))}${
        w.source === "board" && w.id && b.status === "open" ? `<div class="answer"><input id="reply-${w.id}" data-reply-input="${w.id}" value="${esc(replyDrafts[w.id] || "")}" maxlength="1000" autocomplete="off"
          placeholder="answer ${esc(w.name)}" aria-label="answer ${esc(w.name)}"><button class="btn primary" data-reply="${w.id}"${working ? " disabled" : ""}>answer</button><button class="btn" data-done="${w.id}" title="already answered or no longer needed: stop showing it"${working ? " disabled" : ""}>done</button></div>` : ""}</div>
      <time>${w.at ? clock(w.at) : ""}</time></li>`).join("")}</ul>` : "";
  const older = d.message_count > d.stream.length ? `<p class="dim">${d.message_count - d.stream.length} older messages not shown.</p>` : "";
  const lessons = d.lessons ? `<p class="dim"><a href="#/memory">${d.lessons} lesson${d.lessons === 1 ? "" : "s"} saved from this board</a></p>` : "";
  const outcome = b.status !== "open" && b.outcome ? `<p class="goal dim">outcome: ${esc(b.outcome)}</p>` : "";
  const stream = d.stream.length ? logList(d.stream) : '<p class="dim">nothing posted yet.</p>';
  const close = b.status === "open" && !pending ? `<button class="closeb" id="close-board">close board</button>` : "";
  const anyLive = agents.some(([, a]) => a.state !== "left");
  const pingAll = b.status === "open" && anyLive ? `<button class="ping-all" data-ping="all" title="ask every agent on this board to look at it" aria-label="ping all">ping all</button>` : "";
  const sayErr = actionError && errAt === "say" ? `<p class="err">${esc(actionError)}</p>` : "";
  const composer = b.status === "open" ? `<div class="composer"><input id="say" value="${esc(sayDraft)}" maxlength="1000" autocomplete="off"
      placeholder="message everyone, or @name to message one huddler" aria-label="message the huddlers"><button class="btn primary" id="send"${working ? " disabled" : ""}>send</button></div>${sayErr}` : "";
  const err = actionError && errAt === "panel" ? `<p class="err">${esc(actionError)}</p>` : "";
  const busy = working ? " disabled" : "";
  const closePanel = pending && pending.type === "close" && b.status === "open" ? `<div class="confirm" role="group" aria-label="close board">
      <p>close <strong>${esc(b.name)}</strong>? it becomes read-only, its files are released, and lessons are saved to memory.</p>
      <input id="outcome" placeholder="what happened? (optional, helps the lessons)" value="${esc(outcomeDraft)}" autocomplete="off">
      <div class="confirm-actions"><button class="btn primary" id="do-close"${busy}>close board</button><button class="btn" id="cancel">cancel</button></div>${err}</div>` : "";
  const endPanel = pending && pending.type === "end" ? `<div class="confirm" role="group" aria-label="end session">
      <p>end <strong>${esc(pending.name)}</strong>'s session? its files are released and the board is told. if it's still running, it reappears when it next acts.</p>
      <div class="confirm-actions"><button class="btn primary" id="do-end"${busy}>end session</button><button class="btn" id="cancel">cancel</button></div>${err}</div>` : "";
  return `${close}<h1 class="title">${esc(b.name)}</h1>
    <div class="meta">${esc(b.project)}, ${b.status === "open" ? "open" : "closed"} since ${day(b.status === "open" ? b.created_at : b.closed_at || b.created_at)}</div>
    ${goalBox(d)}${outcome}${closePanel}
    ${roster ? `<div class="huddlers"><div class="huddlers-label">${logo}huddlers<span class="count">${here} here now</span>${pingAll}</div><div class="roster">${roster}</div></div>` : ""}${endPanel}
    ${waiting}${composer}
    <div class="stream">${stream}${older}${lessons}</div>`;
}

function lessonList(ls, src = true) {
  return `<ul class="lessons">${ls.map(l => `<li><h3>${esc(l.title)}</h3>
    <p>${esc(l.technique)}</p><p class="dim">when ${esc(l.when_to_apply.charAt(0).toLowerCase() + l.when_to_apply.slice(1))}</p>
    ${src ? `<p class="dim"><a href="#/b/${esc(l.from_board)}">${esc(l.board_name || l.from_board)}</a>, ${esc(l.project)}</p>` : ""}</li>`).join("")}</ul>`;
}

function memory(d, q) {
  const body = d.lessons.length ? lessonList(d.lessons)
    : `<p class="empty">${q ? `nothing matches “${esc(q)}”.` : "nothing here yet. lessons land here when a board closes."}</p>`;
  return `<h1 class="title">memory</h1><div class="meta">what agents learned on past boards</div>
    <input class="search" id="q" type="search" placeholder="search" value="${esc(q)}" aria-label="Search lessons">${body}`;
}

function overview() {
  if (!boards.length) return `<h1 class="title">Huddle Hut</h1><p class="empty">the hut is empty. an agent opens a board with create_board, and others join with its key.</p>`;
  return `<h1 class="title">boards</h1><ul class="boards">${boards.map(b => `<li><a href="#/b/${esc(b.id)}">
    <span><span class="name">${esc(b.name)}</span><span class="dim"> ${esc(b.project)}</span></span>
    <span class="dim">${b.status === "open" ? `${b.active_agents} active, ${ago(b.last_at)}` : "closed"}</span></a></li>`).join("")}</ul>`;
}

function route() {
  const h = location.hash.slice(1); let m;
  if ((m = h.match(/^\/b\/([\w-]+)/))) return {view: "board", board: m[1]};
  if (h.startsWith("/memory")) return {view: "memory", q: new URLSearchParams(h.split("?")[1] || "").get("q") || ""};
  return {view: "overview"};
}

async function render(force = false) {
  const r = route(); let html;
  try {
    boards = await get("/api/boards");
    html = r.view === "board" ? board(await get(`/api/boards/${r.board}`))
      : r.view === "memory" ? memory(await get(`/api/memory?q=${encodeURIComponent(r.q)}`), r.q) : overview();
  } catch (e) {
    html = `<h1 class="title">can't load this</h1><p class="empty">${esc(e.message)}. is huddlehut view still running?</p>`;
  }
  side(r);
  if (!force && html === last) return;
  const focused = document.activeElement && (["q", "outcome", "goal-input", "ms-input", "say"].includes(document.activeElement.id) || /^reply-\d+$/.test(document.activeElement.id)) ? document.activeElement.id : null;
  const caret = focused ? document.activeElement.selectionStart : 0;
  last = html;
  $("#main").innerHTML = html;
  if (focused && document.getElementById(focused)) { const el = document.getElementById(focused); el.focus(); el.setSelectionRange(caret, caret); }
}

async function goRef(id) {
  const el = document.getElementById("m" + id);
  if (!el) return;
  el.scrollIntoView({block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1600);
}

async function act(url, body, onOk, where = "panel") {
  if (working) return;
  working = true; actionError = ""; errAt = where; render(true);
  try {
    const r = await fetch(url, {method: "POST", headers: {"X-Huddlehut": "1", "Content-Type": "application/json"},
                                body: JSON.stringify(body || {})});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    if (onOk) onOk(); else { pending = null; outcomeDraft = ""; }
  } catch (e) {
    actionError = `couldn't do that: ${e.message}`;
  }
  working = false;
  render(true);
}
const closeBoard = () => act(`/api/boards/${route().board}/close`, {outcome: outcomeDraft});
const endSession = () => act(`/api/boards/${route().board}/agents/${encodeURIComponent(pending.agent)}/end`);
const answer = (id, content) => content.trim() && act(`/api/boards/${route().board}/post`, {content, reply_to: Number(id)},
                                                     () => { delete replyDrafts[id]; }, "say");
const say = () => sayDraft.trim() && act(`/api/boards/${route().board}/post`, {content: sayDraft}, () => { sayDraft = ""; }, "say");
async function pingTo(name) {  // put "@name " in the message box; Enter sends it, with or without a note
  const tag = "@" + name;
  if (!new RegExp(`(^|\\s)${tag}(?![\\w-])`, "i").test(sayDraft)) sayDraft = `${tag} ${sayDraft.trim()}`.trimEnd() + " ";
  actionError = "";
  await render(true);
  const f = document.getElementById("say");
  if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
}
const goalAct = (path, body, onOk) => act(`/api/boards/${route().board}/${path}`, body, onOk, "goal");
const saveGoal = () => goalAct("goal", {goal: goalDraft}, () => { goalDraft = null; });
const addMilestone = () => msDraft.trim() && goalAct("milestones", {text: msDraft}, () => { msDraft = ""; });
async function editGoal() {
  goalDraft = cur ? cur.board.goal || "" : ""; actionError = "";
  await render(true);
  const f = document.getElementById("goal-input");
  if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
}
async function ask(next) {
  pending = next; actionError = "";
  await render(true);  // the panel exists only after the render's fetch finishes
  const f = document.getElementById(next.type === "close" ? "outcome" : "do-end");
  if (f) f.focus();
}

document.addEventListener("click", e => {
  if (e.target.id === "close-board") { ask({type: "close"}); return; }
  if (e.target.id === "do-close") { closeBoard(); return; }
  if (e.target.id === "do-end") { endSession(); return; }
  if (e.target.id === "cancel") { pending = null; actionError = ""; render(true); return; }
  if (e.target.closest("#edit-me")) { editMe(); return; }
  if (e.target.id === "send") { say(); return; }
  const rp = e.target.closest("[data-reply]");
  if (rp) { answer(rp.dataset.reply, replyDrafts[rp.dataset.reply] || ""); return; }
  const dn = e.target.closest("[data-done]");
  if (dn) { answer(dn.dataset.done, "done: answered elsewhere or no longer needed"); return; }
  const pg = e.target.closest("[data-ping]");
  if (pg) { pingTo(pg.dataset.ping); return; }
  if (e.target.id === "edit-goal") { editGoal(); return; }
  if (e.target.id === "save-goal") { saveGoal(); return; }
  if (e.target.id === "cancel-goal") { goalDraft = null; actionError = ""; render(true); return; }
  const ms = e.target.closest("[data-ms]");
  if (ms) { goalAct(`milestones/${ms.dataset.ms}`, {done: ms.dataset.done === "1"}, () => {}); return; }
  const del = e.target.closest("[data-del]");
  if (del) { goalAct(`milestones/${del.dataset.del}`, {delete: true}, () => {}); return; }
  const x = e.target.closest("[data-end]");
  if (x) { ask({type: "end", agent: x.dataset.end, name: x.dataset.name}); return; }
  const r = e.target.closest("[data-ref]");
  if (r) { e.preventDefault(); goRef(r.dataset.ref); return; }
  const m = e.target.closest("[data-open]");
  if (m) { open.add(m.dataset.open); render(true); }
});
document.addEventListener("keydown", e => {
  if (e.target.dataset && e.target.dataset.replyInput) {
    if (e.key === "Enter") answer(e.target.dataset.replyInput, e.target.value);
    return;
  }
  if (e.target.id === "say") {
    if (e.key === "Enter") say();
    if (e.key === "Escape") { sayDraft = ""; e.target.value = ""; }
    return;
  }
  if (e.target.id === "me-input") {
    if (e.key === "Enter") saveMe();
    if (e.key === "Escape") { meDraft = null; meError = ""; renderMe(); }
    return;
  }
  if (e.target.id === "goal-input") {
    if (e.key === "Enter") saveGoal();
    if (e.key === "Escape") { goalDraft = null; actionError = ""; render(true); }
    return;
  }
  if (e.target.id === "ms-input") {
    if (e.key === "Enter") addMilestone();
    if (e.key === "Escape") { msDraft = ""; e.target.value = ""; e.target.blur(); }
    return;
  }
  if (!pending) return;
  if (e.key === "Escape") { pending = null; actionError = ""; render(true); }
  if (e.key === "Enter" && e.target.id === "outcome") closeBoard();
});
document.addEventListener("input", e => {
  if (e.target.id === "outcome") { outcomeDraft = e.target.value; return; }
  if (e.target.id === "goal-input") { goalDraft = e.target.value; return; }
  if (e.target.id === "me-input") { meDraft = e.target.value; return; }
  if (e.target.id === "say") { sayDraft = e.target.value; return; }
  if (e.target.dataset && e.target.dataset.replyInput) { replyDrafts[e.target.dataset.replyInput] = e.target.value; return; }
  if (e.target.id === "ms-input") { msDraft = e.target.value; return; }
  if (e.target.id !== "q") return;
  clearTimeout(window._t);
  window._t = setTimeout(() => { history.replaceState(null, "", `#/memory?q=${encodeURIComponent(e.target.value)}`); render(true); }, 250);
});
window.addEventListener("hashchange", () => { last = ""; pending = null; actionError = ""; goalDraft = null; msDraft = ""; sayDraft = ""; render(true); scrollTo(0, 0); });
render(true);
renderMe();
get("/api/me").then(d => { me = d.name; if (meDraft === null) renderMe(); }).catch(() => {});
setInterval(() => { if (!document.hidden) render(); }, 4000);
</script>
</body>
</html>
